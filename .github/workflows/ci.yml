name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Recreate dataset for CI runner
        run: |
          mkdir -p data
          echo "day,temperature" > data/weather.csv
          echo "1,28" >> data/weather.csv
          echo "2,29" >> data/weather.csv
          echo "3,29" >> data/weather.csv
          echo "4,30" >> data/weather.csv
          echo "5,31" >> data/weather.csv

      - name: Retrain Model Artifact
        run: |
          python train.py

      - name: Run Pytest Suite
        run: |
          python -m pytest